<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña · PAIDEIA</title><link rel="icon" href="logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0;font-family:"Source Sans 3",Arial,sans-serif;color:#fff;background:#06192f}body{min-height:100vh;background-image:linear-gradient(rgba(4,18,38,.5),rgba(4,18,38,.5)),url("portal-paideia-2026.jpeg");background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center;padding:24px}.card{width:min(420px,100%);padding:30px 28px;background:rgba(5,24,49,.9);border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 70px rgba(0,0,0,.38)}h1{font-size:1.5rem;margin:0 0 8px}p{line-height:1.45;color:rgba(255,255,255,.8)}label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;height:45px;background:rgba(255,255,255,.09);color:white;border:1px solid rgba(255,255,255,.3);padding:0 12px;font:inherit}button{width:100%;padding:13px;margin-top:18px;background:rgba(212,178,74,.20);border:1px solid rgba(212,178,74,.6);color:white;font:700 1rem "Source Sans 3",Arial,sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:#bce9fb;display:block;text-align:center;margin-top:20px}.message{margin-top:14px;line-height:1.45}.message.error{color:#ffb4b4}.message.success{color:#c8f3df}#resetForm{display:none}
</style>
</head><body><main class="card"><h1>Restablecer contraseña</h1><p>Elegí una contraseña nueva para acceder a PAIDEIA.</p><div id="status" class="message" role="status" aria-live="polite">Validando el enlace de recuperación…</div><form id="resetForm"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">Confirmar nueva contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button id="saveButton" type="submit">Guardar nueva contraseña</button></form><a href="index.html">Volver al ingreso</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mhwcnlkrwylloyxpmmqu.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1od2NubGtyd3lsbG95eHBtbXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDU0MDIsImV4cCI6MjA5MjUyMTQwMn0.gKVGu5aLGQFp2g_GyC-9n-h9pdNULcenw50DsGm6qaU";
const statusEl=document.getElementById('status');const form=document.getElementById('resetForm');let client=null;let recoveryValidated=false;
function status(message,kind=''){statusEl.textContent=message;statusEl.className='message '+kind}
async function init(){if(!window.supabase){status('No se pudo cargar el servicio de autenticación. Recargá esta página.','error');return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const query=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const recoveryLink=query.has('code')||query.has('token_hash')||hash.get('type')==='recovery'||hash.has('access_token');
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryValidated=true;form.style.display='block';status('Enlace validado. Ingresá tu contraseña nueva.')}});
try{if(query.get('token_hash')&&query.get('type')==='recovery'){const {error}=await client.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});if(error)throw error;recoveryValidated=true}
const {data,error}=await client.auth.getSession();if(error)throw error;if(recoveryLink&&data?.session){recoveryValidated=true;form.style.display='block';status('Enlace validado. Ingresá tu contraseña nueva.')}else if(!recoveryValidated){status('El enlace es inválido o venció. Solicitá uno nuevo desde la pantalla de ingreso.','error')}}catch(e){console.error('Enlace de recuperación inválido:',e);status('No se pudo validar el enlace. Solicitá uno nuevo desde la pantalla de ingreso.','error')}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryValidated||!client){status('Necesitás un enlace de recuperación válido.','error');return}const pwd=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(pwd.length<8){status('La contraseña debe tener al menos 8 caracteres.','error');return}if(pwd!==confirm){status('Las contraseñas no coinciden.','error');return}const btn=document.getElementById('saveButton');btn.disabled=true;try{const {error}=await client.auth.updateUser({password:pwd});if(error)throw error;form.style.display='none';status('Contraseña actualizada correctamente. Ya podés volver a ingresar.','success');await client.auth.signOut()}catch(e){console.error('No se pudo actualizar la contraseña:',e);status('No se pudo actualizar la contraseña. Revisá los requisitos e intentá nuevamente.','error')}finally{btn.disabled=false}})
init();
</script></body></html>
