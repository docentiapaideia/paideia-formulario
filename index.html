<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal PAIDEIA</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#68c8e8;--gold:#d4b24a;--muted:rgba(255,255,255,.72);--border:rgba(104,200,232,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:"Source Sans 3",Arial,sans-serif;background:#06192f;color:#fff}
body{
  background-image:linear-gradient(90deg,rgba(3,17,35,.04),rgba(3,17,35,.01)),url("portal-paideia-2026.jpeg");
  background-size:cover;background-position:center center;background-repeat:no-repeat;overflow:hidden
}
.screen{min-height:100vh;width:100%;position:relative}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,18,38,.42);backdrop-filter:blur(2px)}
.login-card{width:min(410px,92vw);border:1px solid rgba(255,255,255,.18);background:rgba(5,24,49,.82);box-shadow:0 24px 70px rgba(0,0,0,.38);padding:30px 28px;text-align:left}
.login-card h1{font-size:1.5rem;font-weight:800;letter-spacing:.04em;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:.94rem;line-height:1.45;margin-bottom:18px}
.login-card input{width:100%;height:44px;margin-bottom:12px;padding:0 13px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.09);color:#fff;outline:none;font-family:inherit;font-size:.92rem}
.login-card input::placeholder{color:rgba(255,255,255,.55)}
.password-field{position:relative}
.password-field input{padding-right:48px}
.password-toggle{position:absolute;right:7px;top:6px;width:34px;height:32px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.login-card button.main{width:100%;height:45px;border:1px solid rgba(212,178,74,.55);background:rgba(212,178,74,.16);color:#fff;font-weight:800;letter-spacing:.05em;cursor:pointer;transition:.2s;font-family:inherit}
.login-card button.main:hover{background:rgba(212,178,74,.28)}
.login-card button.main:disabled{opacity:.65;cursor:wait}
.error{display:none;color:#ffb4b4;font-size:.88rem;margin-top:12px;line-height:1.35}
.portal{display:none;min-height:100vh;align-items:flex-start;justify-content:flex-start;padding-left:clamp(28px,6vw,96px);padding-right:24px;padding-top:clamp(360px,47vh,455px)}
.access-panel{width:min(460px,92vw);margin-top:0}
.portal-kicker,.portal-title,.portal-subtitle{display:none}
.access-list{display:flex;flex-direction:column;gap:14px}
.access-shell{display:block;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.16);background:rgba(2,17,36,.22);padding:7px;transition:.18s;box-shadow:0 18px 35px rgba(0,0,0,.12);backdrop-filter:blur(1px)}
.access-inner{border:1px solid var(--border);background:rgba(7,28,57,.58);min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;transition:.18s}
.access-shell:hover{transform:translateX(4px);border-color:rgba(212,178,74,.45)}
.access-shell:hover .access-inner{background:rgba(104,200,232,.16);border-color:rgba(212,178,74,.62)}
.access-title{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.98rem}
.access-note{display:block;color:rgba(255,255,255,.62);font-size:.74rem;font-weight:600;letter-spacing:.03em;margin-top:1px}
.arrow{color:var(--gold);font-weight:900;font-size:1.25rem;line-height:1}
.admin-access{display:none}
.admin-access.visible{display:block}
.admin-hint{display:none;border:1px solid rgba(255,255,255,.14);background:rgba(7,28,57,.42);color:rgba(255,255,255,.76);padding:12px 14px;font-size:.84rem;line-height:1.35;margin-top:14px;backdrop-filter:blur(1px)}
.admin-hint.visible{display:block}
.top-actions{position:fixed;right:24px;top:22px;display:none;gap:10px;z-index:3}
.top-actions.visible{display:flex}
.logout{border:1px solid rgba(255,255,255,.20);background:rgba(7,28,57,.58);color:#fff;padding:9px 14px;font-weight:800;cursor:pointer;font-family:inherit;backdrop-filter:blur(1px)}
.logout:hover{background:rgba(104,200,232,.14)}
@media(max-width:1000px){.portal{padding-top:410px}}
@media(max-width:760px){body{overflow:auto;background-size:cover;background-position:center top}.portal{align-items:flex-start;padding-top:340px;padding-left:20px;padding-right:20px}.top-actions{top:14px;right:14px}.access-panel{width:100%}}
@media(max-width:480px){.portal{padding-top:320px}.access-inner{min-height:54px;padding:0 16px}.access-title{font-size:.9rem}.access-note{font-size:.7rem}}
</style>
</head>
<body>
<div class="screen">
<section id="loginScreen" class="login">
  <div class="login-card">
    <h1>Ingreso PAIDEIA</h1>
    <p>Accedé con tu usuario autorizado para ingresar al portal.</p>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <div class="password-field">
      <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="password-toggle" type="button" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Mostrar contraseña">👁️</button>
    </div>
    <button id="loginButton" class="main" type="button" onclick="login()">Ingresar</button>
    <div id="authLoginError" class="error"></div>
  </div>
</section>
<div id="topActions" class="top-actions"><button class="logout" type="button" onclick="logout()">Cerrar sesión</button></div>
<main id="portalScreen" class="portal">
  <section class="access-panel">
    <div class="access-list">
      <a class="access-shell" href="buenas-practicas.html"><div class="access-inner"><div><span class="access-title">Buenas prácticas</span><span class="access-note">Repositorio y experiencias</span></div><span class="arrow">›</span></div></a>
      <a class="access-shell admin-access" href="Campus_IA/index.html" data-admin-only><div class="access-inner"><div><span class="access-title">Campus IA</span><span class="access-note">Formación interna</span></div><span class="arrow">›</span></div></a>
      <a class="access-shell admin-access" href="PaideIA-Planner/index.html" data-admin-only><div class="access-inner"><div><span class="access-title">PaideIA Planner</span><span class="access-note">Gestión y seguimiento</span></div><span class="arrow">›</span></div></a>
    </div>
    <div id="adminHint" class="admin-hint">Las herramientas Campus IA y PaideIA Planner están disponibles solo para usuarios administradores.</div>
  </section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mhwcnlkrwylloyxpmmqu.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1od2NubGtyd3lsbG95eHBtbXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDU0MDIsImV4cCI6MjA5MjUyMTQwMn0.gKVGu5aLGQFp2g_GyC-9n-h9pdNULcenw50DsGm6qaU";
let supabaseClient=null;let currentRole="user";
function initSupabase(){if(!window.supabase){showLogin("No se pudo cargar Supabase. Recargá la página.");return false}if(!supabaseClient){supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}return true}
function togglePasswordVisibility(inputId,btn){const input=document.getElementById(inputId);if(!input)return;const showing=input.type==="text";input.type=showing?"password":"text";if(btn)btn.textContent=showing?"👁️":"🙈"}
function showLogin(message=""){document.getElementById("loginScreen").style.display="flex";document.getElementById("portalScreen").style.display="none";document.getElementById("topActions").classList.remove("visible");const err=document.getElementById("authLoginError");err.style.display=message?"block":"none";err.textContent=message}
function showPortal(){document.getElementById("loginScreen").style.display="none";document.getElementById("portalScreen").style.display="flex";document.getElementById("topActions").classList.add("visible");applyRoleVisibility()}
function applyRoleVisibility(){const isAdmin=currentRole==="admin";document.querySelectorAll("[data-admin-only]").forEach(el=>el.classList.toggle("visible",isAdmin));const hint=document.getElementById("adminHint");if(hint)hint.classList.toggle("visible",!isAdmin)}
async function loadCurrentRole(){currentRole="user";const {data:userData}=await supabaseClient.auth.getUser();const user=userData?.user;if(!user)return"user";const {data,error}=await supabaseClient.from("profiles").select("role").eq("id",user.id).maybeSingle();if(error){console.warn("No se pudo leer el rol del perfil:",error.message);return"user"}currentRole=data?.role||"user";return currentRole}
async function initAuth(){if(!initSupabase())return;try{const {data}=await supabaseClient.auth.getSession();if(data?.session){await loadCurrentRole();showPortal()}else{showLogin()}}catch(e){console.error(e);showLogin()}}
async function login(){if(!supabaseClient&&!initSupabase())return;const email=document.getElementById("loginEmail").value.trim();const password=document.getElementById("loginPassword").value;const button=document.getElementById("loginButton");if(!email||!password){showLogin("Completá email y contraseña.");return}button.disabled=true;button.textContent="Ingresando...";try{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){showLogin(error.message||"Credenciales incorrectas.");return}await loadCurrentRole();showPortal()}catch(err){console.error(err);showLogin("No se pudo iniciar sesión. Intentá nuevamente.")}finally{button.disabled=false;button.textContent="Ingresar"}}
async function logout(){if(!supabaseClient&&!initSupabase())return;await supabaseClient.auth.signOut();currentRole="user";showLogin()}
document.addEventListener("DOMContentLoaded",initAuth);
</script>
</body>
</html>
