<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal PAIDEIA</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul-profundo:#061b33;
  --azul:#0b3156;
  --celeste:#47bdd1;
  --celeste-suave:rgba(94,196,214,.42);
  --dorado:#d7b04a;
  --blanco:#ffffff;
  --texto-suave:rgba(255,255,255,.78);
  --sombra:0 22px 70px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;}
body{
  font-family:'Source Sans 3',Arial,sans-serif;
  color:var(--blanco);
  background:#061b33;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(90deg,rgba(4,18,34,.08),rgba(4,18,34,.02)),
    url('portal-paideia-2026.png') center center/cover no-repeat;
  z-index:-2;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(90deg,rgba(2,10,22,.24),rgba(2,10,22,.04));
  z-index:-1;
  pointer-events:none;
}
.auth-login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.auth-login-card{
  width:100%;
  max-width:420px;
  background:rgba(5,25,48,.76);
  border:1px solid rgba(143,221,235,.24);
  box-shadow:var(--sombra);
  border-radius:4px;
  padding:30px 28px;
  backdrop-filter:blur(10px);
}
.auth-login-card img{
  width:76px;
  height:76px;
  object-fit:contain;
  display:block;
  margin:0 auto 16px;
  opacity:.94;
}
.auth-login-card h1{
  text-align:center;
  font-size:1.75rem;
  line-height:1.1;
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:.02em;
}
.auth-login-card p{
  text-align:center;
  color:var(--texto-suave);
  margin-bottom:22px;
  line-height:1.45;
}
.auth-login-card input{
  width:100%;
  height:44px;
  border:1px solid rgba(143,221,235,.24);
  background:rgba(255,255,255,.08);
  color:var(--blanco);
  border-radius:2px;
  padding:0 13px;
  font:inherit;
  outline:none;
  margin-bottom:12px;
}
.auth-login-card input::placeholder{color:rgba(255,255,255,.55)}
.auth-login-card input:focus{border-color:rgba(215,176,74,.72);background:rgba(255,255,255,.12)}
.password-field{position:relative;width:100%}
.password-field input{padding-right:48px}
.password-toggle{
  position:absolute;
  right:7px;
  top:5px;
  width:34px;
  height:34px;
  border:1px solid rgba(143,221,235,.22);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:2px;
  cursor:pointer;
}
.login-btn{
  width:100%;
  height:46px;
  border:1px solid rgba(215,176,74,.7);
  background:rgba(215,176,74,.18);
  color:#fff;
  border-radius:2px;
  font:inherit;
  font-weight:800;
  letter-spacing:.03em;
  cursor:pointer;
  transition:.2s ease;
}
.login-btn:hover{background:rgba(215,176,74,.32)}
.login-btn:disabled{opacity:.7;cursor:wait}
.auth-login-error{
  display:none;
  margin-top:12px;
  color:#ffd2d2;
  font-size:.92rem;
  text-align:center;
}
.portal-shell{
  min-height:100vh;
  display:none;
  position:relative;
}
.logout-btn{
  position:fixed;
  right:24px;
  top:22px;
  z-index:10;
  border:1px solid rgba(255,255,255,.24);
  background:rgba(4,23,44,.42);
  color:#fff;
  padding:8px 15px;
  border-radius:2px;
  font:inherit;
  font-size:.84rem;
  font-weight:800;
  cursor:pointer;
  backdrop-filter:blur(5px);
}
.logout-btn:hover{border-color:rgba(215,176,74,.72);background:rgba(4,23,44,.66)}
.portal-access{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:120px 24px 150px;
}
.access-panel{
  width:min(520px,92vw);
  margin-left:clamp(-320px,-25vw,-90px);
  transform:translateY(8px);
}
.access-title{
  text-align:center;
  margin-bottom:22px;
}
.access-title .kicker{
  display:inline-block;
  font-size:.74rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:rgba(143,221,235,.9);
  margin-bottom:7px;
}
.access-title h1{
  font-size:1.42rem;
  font-weight:800;
  line-height:1.1;
  letter-spacing:.03em;
}
.access-title p{
  color:rgba(255,255,255,.66);
  font-size:.93rem;
  margin-top:5px;
}
.portal-options{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.portal-tile{
  display:block;
  text-decoration:none;
  color:#fff;
  border:1px solid rgba(143,221,235,.24);
  background:rgba(4,24,45,.18);
  padding:7px;
  border-radius:2px;
  transition:border-color .2s ease, background .2s ease;
}
.portal-tile-inner{
  min-height:56px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(6,32,57,.56);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:0 18px;
  border-radius:1px;
  transition:background .2s ease,border-color .2s ease;
}
.portal-tile:hover{
  border-color:rgba(215,176,74,.7);
  background:rgba(4,24,45,.28);
}
.portal-tile:hover .portal-tile-inner{
  background:rgba(11,58,92,.72);
  border-color:rgba(215,176,74,.52);
}
.portal-tile strong{
  font-size:1rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.portal-tile span{
  font-size:.82rem;
  color:rgba(255,255,255,.58);
  white-space:nowrap;
}
.portal-tile .arrow{
  color:var(--dorado);
  font-size:1rem;
  opacity:.85;
}
@media (max-width:1000px){
  body::before{background-position:center center;}
  .access-panel{margin-left:0;transform:none;background:rgba(5,25,48,.28);padding:18px;border:1px solid rgba(143,221,235,.14);backdrop-filter:blur(4px)}
}
@media (max-width:560px){
  .portal-access{padding:96px 18px 120px;align-items:center;}
  .access-title h1{font-size:1.25rem}
  .portal-tile-inner{min-height:58px;padding:0 13px;}
  .portal-tile strong{font-size:.9rem;letter-spacing:.05em;}
  .portal-tile span{display:none;}
  .logout-btn{right:14px;top:14px}
}
</style>
</head>
<body>

<div id="loginScreen" class="auth-login-page">
  <div class="auth-login-card">
    <img src="logo.png" alt="PaideIA" onerror="this.style.display='none';">
    <h1>Ingreso PAIDEIA</h1>
    <p>Accedé con tu usuario autorizado para ingresar al portal.</p>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <div class="password-field">
      <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="password-toggle" type="button" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Mostrar contraseña">👁️</button>
    </div>
    <button id="loginButton" class="login-btn" type="button" onclick="login()">Ingresar</button>
    <div id="authLoginError" class="auth-login-error"></div>
  </div>
</div>

<div id="portalContent" class="portal-shell">
  <button class="logout-btn" type="button" onclick="logout()">Cerrar sesión</button>

  <main class="portal-access">
    <section class="access-panel">
      <div class="access-title">
        <span class="kicker">Portal de acceso</span>
        <h1>PAIDEIA</h1>
        <p>Herramientas, recursos y gestión institucional.</p>
      </div>

      <div class="portal-options">
        <a class="portal-tile" href="buenas-practicas.html">
          <div class="portal-tile-inner">
            <strong>Buenas prácticas</strong>
            <span>Repositorio</span>
            <em class="arrow">›</em>
          </div>
        </a>

        <a class="portal-tile" href="Campus_IA/index.html">
          <div class="portal-tile-inner">
            <strong>Campus IA</strong>
            <span>Formación</span>
            <em class="arrow">›</em>
          </div>
        </a>

        <a class="portal-tile" href="PaideIA-Planner/index.html">
          <div class="portal-tile-inner">
            <strong>PaideIA Planner</strong>
            <span>Gestión</span>
            <em class="arrow">›</em>
          </div>
        </a>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mhwcnlkrwylloyxpmmqu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1od2NubGtyd3lsbG95eHBtbXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDU0MDIsImV4cCI6MjA5MjUyMTQwMn0.gKVGu5aLGQFp2g_GyC-9n-h9pdNULcenw50DsGm6qaU";
let supabaseClient = null;

function initSupabase(){
  if(!window.supabase){
    showLogin("No se pudo cargar Supabase. Revisá tu conexión o recargá la página.");
    return false;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}

function getNextUrl(){
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next");
  if(!next) return "";
  if(next.startsWith("http://") || next.startsWith("https://") || next.startsWith("//")) return "";
  return next;
}

function showLogin(message=""){
  document.getElementById("portalContent").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  const err = document.getElementById("authLoginError");
  if(err){
    err.style.display = message ? "block" : "none";
    err.textContent = message;
  }
}

function showPortal(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("portalContent").style.display = "block";
}

async function initAuth(){
  if(!initSupabase()) return;
  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session){
      const next = getNextUrl();
      if(next){
        window.location.href = next;
        return;
      }
      showPortal();
    }else{
      showLogin();
    }
  }catch(err){
    console.error("Error initAuth:", err);
    showLogin("Ocurrió un error al iniciar. Recargá la página.");
  }
}

async function login(){
  if(!supabaseClient && !initSupabase()) return;
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const button = document.getElementById("loginButton");

  if(!email || !password){
    showLogin("Completá email y contraseña.");
    return;
  }

  button.disabled = true;
  button.textContent = "Ingresando...";

  try{
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      showLogin(error.message || "Credenciales incorrectas.");
      return;
    }
    const next = getNextUrl();
    if(next){
      window.location.href = next;
      return;
    }
    showPortal();
  }catch(err){
    console.error("Error login:", err);
    showLogin("No se pudo iniciar sesión. Intentá nuevamente.");
  }finally{
    button.disabled = false;
    button.textContent = "Ingresar";
  }
}

async function logout(){
  if(!supabaseClient && !initSupabase()) return;
  await supabaseClient.auth.signOut();
  showLogin();
}

function togglePasswordVisibility(inputId, button){
  const input = document.getElementById(inputId);
  if(!input) return;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  button.textContent = showing ? "👁️" : "🙈";
}

document.getElementById("loginPassword").addEventListener("keydown", function(e){
  if(e.key === "Enter") login();
});

document.addEventListener("DOMContentLoaded", initAuth);
</script>
</body>
</html>
