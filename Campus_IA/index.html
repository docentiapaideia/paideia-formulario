<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus IA - PaideIA</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand">
        <img src="assets/logo.png" alt="Logo PaideIA">
        <div>
          <h1>Campus IA</h1>
          <p>Guía práctica de uso de Inteligencia Artificial</p>
        </div>
      </div>
      <nav class="menu">
        <button class="nav-btn active" data-module="inicio">🏠 Inicio</button>
        <button class="nav-btn" data-module="chatgpt">🤖 ChatGPT</button>
        <button class="nav-btn" data-module="claude">🟣 Claude</button>
        <button class="nav-btn" data-module="gemini">🔵 Gemini</button>
        <button class="nav-btn" data-module="copilot">🟦 Copilot</button>
        <button class="nav-btn" data-module="laboratorio">🧪 Laboratorio</button>
      </nav>
    </div>

    <div class="sidebar-footer">
      <strong>PaideIA</strong>
      <span>Uso responsable, crítico y educativo de IA.</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <span class="tag">PaideIA · Formación Digital</span>
        <h2 id="pageTitle">Inicio</h2>
      </div>
      <div class="ai-icons">
        <div class="ai-logo"><img src="assets/chatgpt.png" alt="ChatGPT"></div>
        <div class="ai-logo"><img src="assets/claude.png" alt="Claude"></div>
        <div class="ai-logo"><img src="assets/gemini.png" alt="Gemini"></div>
        <div class="ai-logo"><img src="assets/copilot.png" alt="Copilot"></div>
      </div>
    </header>

    <section id="content" class="content-card"></section>
  </main>

  <div class="modal" id="infoModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
